name: Windows portable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Test
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Publish
        shell: pwsh
        run: ./scripts/Publish.ps1 -Online
      - name: Verify and package
        shell: pwsh
        run: |
          ./scripts/Test-Portable.ps1 -Directory artifacts/win-x64-0.3.4
          New-Item -ItemType Directory artifacts/release -Force | Out-Null
          Compress-Archive artifacts/win-x64-0.3.4/* artifacts/release/VindictusDyeFinder-0.3.4-win-x64.zip
          $hash = (Get-FileHash artifacts/release/VindictusDyeFinder-0.3.4-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VindictusDyeFinder-0.3.4-win-x64.zip" | Set-Content artifacts/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-0.3.4
          path: artifacts/release/*
          if-no-files-found: error
